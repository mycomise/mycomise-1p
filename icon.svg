<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- 背景 -->
  <rect width="192" height="192" rx="32" fill="#1a1a1a"/>
  <!-- 上下のゴールドライン -->
  <rect x="16" y="20" width="160" height="4" rx="2" fill="#f5c842"/>
  <rect x="16" y="168" width="160" height="4" rx="2" fill="#f5c842"/>
  <!-- メインテキスト「焼き鳥」 -->
  <text x="96" y="96" font-size="52" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#f5c842" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">焼き鳥</text>
  <!-- サブテキスト「串焼き」 -->
  <text x="96" y="148" font-size="36" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#e8e8e8" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">串焼き</text>
  <!-- 中央の区切りライン -->
  <rect x="40" y="120" width="112" height="2" rx="1" fill="#444"/>
</svg>
