<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>焼き鳥・串焼き</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: #f0f0f0;
      color: #111;
      padding: 12px;
    }

    /* 画面用の操作バー（印刷時は非表示） */
    .toolbar {
      max-width: 800px;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 10px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .toolbar h1 { font-size: 1.1rem; margin-bottom: 8px; }
    .toolbar p { font-size: 0.85rem; color: #555; line-height: 1.7; margin-bottom: 10px; }
    .print-btn {
      display: inline-block;
      background: #e07020;
      color: #fff;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
    }
    .print-btn:active { background: #c05e15; }
    .back-link {
      display: inline-block;
      margin-left: 12px;
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* A4 用紙 */
    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #fff;
      padding: 8mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 5mm;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    /* 1枚のフォーム */
    .form {
      border: 2px solid #000;
      border-radius: 3mm;
      padding: 3mm 3.5mm;
      display: flex;
      flex-direction: column;
    }
    .form-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #000;
      padding-bottom: 1.5mm;
      margin-bottom: 1.5mm;
    }
    .form-title { font-size: 3.6mm; font-weight: 800; }
    .form-date { font-size: 3mm; }
    .form-date .line {
      display: inline-block;
      width: 22mm;
      border-bottom: 1px solid #000;
    }

    .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5mm 0;
    }
    .row-name {
      font-size: 3.4mm;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-box {
      width: 20mm;
      height: 7mm;
      border: 1.5px solid #000;
      border-radius: 1mm;
      flex-shrink: 0;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; margin: 0; page-break-after: always; }
    }

    @page { size: A4; margin: 0; }
  </style>
</head>
<body>

<div class="toolbar">
  <h1>🍢 焼き鳥・串焼き</h1>
  <p>
    A4に6枚印刷されます。営業終了後、各品目の残数を大きくハッキリと枠内に書いてください。<br>
    記入した1枠（1枚分）をカメラで撮影すると、アプリが数字を読み取ります。
  </p>
  <button class="print-btn" onclick="window.print()">🖨️ 印刷する</button>
  <a class="back-link" href="./v5.html">← アプリに戻る</a>
</div>

<div class="sheet" id="sheet"></div>

<script>
  // アプリと同じ品目名を読み込む（未設定ならデフォルト）
  const defaultBaseNames = ['ねぎま','むね','ぼんじり','せせり','ハツ','レバー','とり皮','砂肝','ささみ'];

  function getItemNames() {
    let base;
    try {
      const raw = JSON.parse(localStorage.getItem('yakitori_base_item_defs') || 'null');
      base = raw && raw.length ? raw.map((d, i) => d.name || defaultBaseNames[i]) : defaultBaseNames.slice();
    } catch (e) { base = defaultBaseNames.slice(); }

    let custom = [];
    try {
      const raw = JSON.parse(localStorage.getItem('yakitori_custom_items') || '[]');
      custom = raw.map(d => (d.name || '').trim()).filter(n => n);
    } catch (e) { custom = []; }

    return [...base, ...custom];
  }

  function buildForm(names) {
    const rows = names.map(n => `
      <div class="row">
        <span class="row-name">${n}</span>
        <span class="row-box"></span>
      </div>`).join('');
    return `
      <div class="form">
        <div class="form-head">
          <span class="form-title">焼き鳥・串焼き</span>
          <span class="form-date">日付 <span class="line"></span></span>
        </div>
        <div class="rows">${rows}</div>
      </div>`;
  }

  // 11品ちょうどに整える（多ければ切り、少なければ空欄で補う）
  let names = getItemNames().slice(0, 11);
  while (names.length < 11) names.push('');

  const sheet = document.getElementById('sheet');
  sheet.innerHTML = Array.from({ length: 6 }, () => buildForm(names)).join('');
</script>

</body>
</html>
